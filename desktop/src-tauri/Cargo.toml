[package]
name = "seroguld_crm_desktop"
version = "0.3.33"
description = "Sero Guld CRM desktop shell"
authors = ["Sero Guld"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
aes-gcm = "0.10"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
keyring-core = "1.0.0"
# Klasör izleme (İş 4): Epson scan-to-folder hattı. Tauri store plugin yerine
# doğrudan filesystem olay izleyici — watcher mevcut OCR hattını besler.
notify = "6"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.2", features = [] }
tauri-plugin-single-instance = "2"
# tauri 2.10.3 lock sürümüyle uyumlu updater plugin'i; pubkey/endpoints
# tauri.conf.json > plugins.updater içinden okunur.
tauri-plugin-updater = "2.10.1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

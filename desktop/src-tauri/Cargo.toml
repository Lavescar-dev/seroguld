[package]
name = "seroguld_crm_desktop"
version = "0.2.0"
description = "Sero Guld CRM desktop shell"
authors = ["Sero Guld"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
aes-gcm = "0.10"
keyring = "3.6"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.2", features = [] }
zeroize = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

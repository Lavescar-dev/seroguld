# Secondary web/compose stack. Canonical production target is desktop-first.
services:
  postgres:
    image: postgres:16
    container_name: seroguld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seroguld}
      POSTGRES_USER: ${POSTGRES_USER:-seroguld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seroguld}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seroguld} -d ${POSTGRES_DB:-seroguld}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: seroguld-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: seroguld-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://backend:8000
      VITE_WS_BASE_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  collabora:
    image: collabora/code:24.04.13.2.1
    container_name: seroguld-collabora
    restart: unless-stopped
    network_mode: host
    shm_size: "1gb"
    environment:
      extra_params: --o:ssl.enable=false --o:ssl.termination=false
      aliasgroup1: http://127.0.0.1:8100
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9980/hosting/discovery >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:8.2.2}
    container_name: seroguld-onlyoffice
    restart: unless-stopped
    network_mode: host
    shm_size: "1gb"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-seroguld-onlyoffice-secret}
      JWT_HEADER: Authorization
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "postgres"
      DB_USER: "postgres"
      DB_PWD: ""
      REDIS_SERVER_HOST: "127.0.0.1"
      REDIS_SERVER_PORT: "6379"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: seroguld-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:

name: desktop-feedback-windows

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Feedback pilot API base URL"
        required: true
        default: "https://seroguld.193.234.88.63.sslip.io"
      ws_base_url:
        description: "Feedback pilot WebSocket base URL"
        required: true
        default: "https://seroguld.193.234.88.63.sslip.io"
      feedback_email:
        description: "Feedback mail target"
        required: true
        default: "info@seroguld.dk"
      feedback_channel:
        description: "Feedback channel label"
        required: true
        default: "vps-feedback-pilot"

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build for feedback pilot
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
          VITE_WS_BASE_URL: ${{ inputs.ws_base_url }}
          VITE_FEEDBACK_EMAIL: ${{ inputs.feedback_email }}
          VITE_FEEDBACK_CHANNEL: ${{ inputs.feedback_channel }}
        run: npm run build

      - name: Desktop install
        working-directory: desktop
        run: npm ci

      - name: Tauri NSIS build
        working-directory: desktop
        env:
          CI: "true"
        run: npm run tauri build

      - name: Windows display route smoke
        working-directory: desktop
        shell: pwsh
        env:
          SEROGULD_DESKTOP_START_ROUTE: /display/idle
          TAURI_DRIVER_URL: http://127.0.0.1:4444
          DESKTOP_SMOKE_APPLICATION: ${{ github.workspace }}\desktop\src-tauri\target\release\seroguld_crm_desktop.exe
        run: |
          cargo install tauri-driver --locked

          $webViewCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe",
            "${env:ProgramFiles}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe"
          )
          $webViewExe = Get-ChildItem -Path $webViewCandidates -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.VersionInfo.ProductVersion } -Descending |
            Select-Object -First 1
          if (-not $webViewExe) {
            throw "Microsoft Edge WebView2 runtime executable was not found"
          }

          $webViewVersion = $webViewExe.VersionInfo.ProductVersion
          $driverZip = Join-Path $env:RUNNER_TEMP "msedgedriver-$webViewVersion.zip"
          $driverDir = Join-Path $env:RUNNER_TEMP "msedgedriver-$webViewVersion"
          $driverUrl = "https://msedgedriver.microsoft.com/$webViewVersion/edgedriver_win64.zip"
          New-Item -ItemType Directory -Force -Path $driverDir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $driverUrl -OutFile $driverZip
          Expand-Archive -Force -Path $driverZip -DestinationPath $driverDir
          $nativeDriver = Join-Path $driverDir "msedgedriver.exe"
          if (-not (Test-Path $nativeDriver)) {
            throw "Matching msedgedriver was not extracted: $nativeDriver"
          }
          Write-Host "WebView2 runtime: $webViewVersion"
          & $nativeDriver --version

          $driver = Start-Process -FilePath "tauri-driver" -ArgumentList "--port", "4444", "--native-port", "4445", "--native-driver", $nativeDriver -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "$env:TAURI_DRIVER_URL/status" | Out-Null
                $ready = $true
              } catch {
                $ready = $false
                Start-Sleep -Seconds 1
              }
            } while (-not $ready -and (Get-Date) -lt $deadline)

            if (-not $ready) {
              throw "tauri-driver did not become ready"
            }

            node tests/windows-display-smoke.mjs
          } finally {
            if ($driver -and -not $driver.HasExited) {
              Stop-Process -Id $driver.Id -Force
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERO_GULD_CRM_feedback_windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

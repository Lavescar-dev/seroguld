name: windows-desktop-release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Windows app API base URL"
        required: true
        default: "http://192.168.1.105:8100"
      ws_base_url:
        description: "Windows app WebSocket base URL"
        required: true
        default: "http://192.168.1.105:8100"
  push:
    tags:
      - "seroguld-desktop-v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://192.168.1.105:8100' }}
          VITE_WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'http://192.168.1.105:8100' }}
        run: npm run build

      - name: Desktop install
        working-directory: desktop
        run: npm ci

      - name: Tauri NSIS build
        working-directory: desktop
        env:
          CI: "true"
        run: npm run tauri build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERO_GULD_CRM_windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/seroguld-desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

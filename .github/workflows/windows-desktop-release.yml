name: windows-desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "seroguld-desktop-v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    # Normal tur ~30 dk; 60 dk sinir asili adimin 6 saatlik varsayilani
    # yakmasini (private repoda Windows runner dakikasi 2x sayilir) engeller.
    timeout-minutes: 60

    steps:
      # Release scripts enforce a fixed source tree name (donor-tree guard in
      # release-windows-native.ps1 and build-windows-runtime.ps1: only
      # seroguld-crm-latest-windows may produce a release). Match the local
      # build layout by checking out under that exact folder name.
      - uses: actions/checkout@v4
        with:
          path: seroguld-crm-latest-windows

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend install
        working-directory: seroguld-crm-latest-windows/frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: seroguld-crm-latest-windows/frontend
        run: npm run typecheck

      - name: Desktop install
        working-directory: seroguld-crm-latest-windows/desktop
        run: npm ci

      - name: Isolated installer migration and ACL smoke
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: ./scripts/windows-installer-smoke.ps1

      - name: Seed recoverable finalization fixture
        shell: powershell
        run: |
          $downloads = Join-Path ([Environment]::GetFolderPath("UserProfile")) "Downloads"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $legacy = Join-Path $downloads "SERO-GULD-CRM-FULL-SETUP.exe"
          Set-Content -LiteralPath $legacy -Value "ci-replaced-installer-fixture" -Encoding ASCII
          $hash = (Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$legacy.sha256" -Value "$hash  SERO-GULD-CRM-FULL-SETUP.exe" -Encoding ASCII
          [ordered]@{ installer_sha256 = $hash; fixture = $true } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $downloads "SERO-GULD-CRM-FULL-SETUP.manifest.json") -Encoding UTF8

      - name: Provision customer integration seed input
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        env:
          SEROGULD_CUSTOMER_RUNTIME_ENV_B64: ${{ secrets.SEROGULD_CUSTOMER_RUNTIME_ENV_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SEROGULD_CUSTOMER_RUNTIME_ENV_B64)) {
            throw "Required customer runtime environment secret is not configured"
          }
          try {
            $bytes = [Convert]::FromBase64String($env:SEROGULD_CUSTOMER_RUNTIME_ENV_B64)
          } catch {
            throw "Customer runtime environment secret is not valid base64"
          }
          [System.IO.File]::WriteAllBytes((Join-Path $PWD ".env"), $bytes)

      # -Python pins the exact setup-python interpreter: the runner's py
      # launcher resolves to the image's preinstalled (newer) Python, whose
      # ABI has no Windows wheels for the pinned compiled packages.
      #
      # The runner appends "exit $LASTEXITCODE" to every shell:powershell
      # script, so a stale exit code from any tolerated native call (e.g. a
      # warning-only tool) fails this step AFTER the release script printed
      # its final success line. The release script itself throws on every
      # real failure, which kills the process before "exit 0" is reached, so
      # the explicit exit only normalizes the success path.
      - name: Build and verify Dockerless Windows release
        env:
          CI: "true"
          VITE_API_BASE_URL: "http://127.0.0.1:8100"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_WS_BASE_URL: "http://127.0.0.1:8100"
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: |
          ./scripts/release-windows-native.ps1 -OutputDirectory .run/windows-native-release -Finalize -RunDefenderScan -Python "$env:pythonLocation\python.exe"
          Write-Host "Release script basarili bitti (runner'a kalan LASTEXITCODE=$LASTEXITCODE)"
          exit 0

      - name: Remove customer integration seed input
        if: always()
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: |
          Remove-Item -LiteralPath ".env" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "backend/runtime-seed.env" -Force -ErrorAction SilentlyContinue

      - name: Verify finalized Downloads delivery and archive rollback contract
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: |
          $downloads = Join-Path ([Environment]::GetFolderPath("UserProfile")) "Downloads"
          $release = ".run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe"
          $final = Join-Path $downloads "SERO-GULD-CRM-FULL-SETUP.exe"
          $releaseHash = (Get-FileHash -LiteralPath $release -Algorithm SHA256).Hash.ToLowerInvariant()
          $finalHash = (Get-FileHash -LiteralPath $final -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releaseHash -ne $finalHash) { throw "Final Downloads installer hash mismatch" }
          $manifest = Get-Content -LiteralPath (Join-Path $downloads "SERO-GULD-CRM-FULL-SETUP.manifest.json") -Raw | ConvertFrom-Json
          if (-not $manifest.final_copy_performed -or $manifest.final_destination_sha256 -ne $finalHash) {
            throw "Final Downloads manifest coherence failed"
          }
          $archive = Join-Path $downloads "SeroGuldCRM-archive"
          $archived = @(Get-ChildItem -LiteralPath $archive -Filter "*-replaced-SERO-GULD-CRM-FULL-SETUP.exe" -File)
          if ($archived.Count -ne 1) { throw "Replaced installer fixture was not archived exactly once" }
          foreach ($suffix in @('.sha256', '.archive.json')) {
            if (-not (Test-Path -LiteralPath "$($archived[0].FullName)$suffix" -PathType Leaf)) {
              throw "Archive integrity sidecar missing: $suffix"
            }
          }
          $originalSidecars = @(Get-ChildItem -LiteralPath $archive -Filter "$($archived[0].Name).sidecar-*" -File)
          if ($originalSidecars.Count -ne 2) { throw "Original installer sidecars were not preserved" }

      - name: Install verified NSIS on ephemeral runner
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe" -ArgumentList "/S" -PassThru
          # Normal sessiz kurulum ~1-3 dk. Asili kurulum 6 saatlik job
          # timeout'unu beklemesin: sinirda canli prosesler + kurulumun kendi
          # temizlik logu dump edilir, boylece tek kosuda kok neden gorunur.
          if (-not $process.WaitForExit(480000)) {
            Write-Host "Kurulum 8 dk'da bitmedi — canli prosesler:"
            Get-Process | Where-Object { $_.Name -match 'seroguld|setup|nsis|consent|msiexec|powershell|icacls|docker' } |
              Format-Table Id, Name, StartTime, CPU -AutoSize | Out-String -Width 200 | Write-Host
            $cleanupLog = Join-Path $env:ProgramData "SeroGuldCRM\logs\installer-cleanup.log"
            if (Test-Path -LiteralPath $cleanupLog) {
              Write-Host "--- installer-cleanup.log (son 40 satır):"
              Get-Content -LiteralPath $cleanupLog | Select-Object -Last 40 | Write-Host
            } else {
              Write-Host "--- installer-cleanup.log YOK (temizlik scripti hic baslamadi/bitenmedi)"
            }
            Stop-Process -Id $process.Id -Force
            throw "NSIS silent install 8 dk icinde bitmedi (timeout) — teshis yukarida"
          }
          # WaitForExit(int) true donse bile ExitCode PS 5.1'de null kalabilir;
          # parametresiz bekleme cikis kodunu garanti eder (cikmis surecte anlik).
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "NSIS silent install failed: $($process.ExitCode)" }

      - name: Installed desktop acceptance
        working-directory: seroguld-crm-latest-windows
        shell: powershell
        run: ./scripts/windows-desktop-acceptance.ps1 -ForceCloseAfterChecks

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SERO_GULD_CRM_windows
          path: |
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe.sha256
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe.sig
            seroguld-crm-latest-windows/.run/windows-native-release/latest.json
            seroguld-crm-latest-windows/.run/windows-native-release/release-manifest.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/seroguld-desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe.sha256
            seroguld-crm-latest-windows/.run/windows-native-release/SERO-GULD-CRM-FULL-SETUP.exe.sig
            seroguld-crm-latest-windows/.run/windows-native-release/latest.json
            seroguld-crm-latest-windows/.run/windows-native-release/release-manifest.json
          generate_release_notes: true

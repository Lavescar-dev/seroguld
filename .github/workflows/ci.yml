name: ci

# Repo public: standart runner dakikası sınırsız — push/PR'de otomatik koşar.
# (Eski "Actions dakika bütçesi" notu private-repo varsayımıydı; gate'ler
# yine de Windows'ta lokal de koşulabilir — bkz. AGENTS.md.)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "desktop/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "desktop/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend setup
        run: bash scripts/setup-dev.sh --backend-only

      - name: Frontend setup
        run: bash scripts/setup-dev.sh --frontend-only

      - name: Backend pytest
        run: bash scripts/test.sh --backend-only

      - name: Frontend typecheck and Vitest
        run: bash scripts/test.sh --frontend-only

      - name: Frontend lint and i18n gate
        run: |
          cd frontend
          npm run lint
          npm run i18n:check

      - name: Frontend coverage thresholds
        run: |
          cd frontend
          npm run test:coverage

      - name: Frontend truth guard
        run: bash scripts/check-frontend-truth.sh

      - name: Frontend build
        run: bash scripts/frontend-build.sh

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend smoke
        run: bash scripts/frontend-smoke.sh

  desktop-shell-smoke:
    runs-on: ubuntu-latest
    # Bu job tarihsel olarak 6 saatte GitHub iptaline kadar asılı kaldı
    # (tauri-driver new-session'ın zaman aşımı yok + sıfırdan Rust derlemesi
    # + xvfb'de WebKitGTK). smoke artık kendi wall-clock watchdog'unu taşıyor;
    # job bandı da güvence: en kötü 45 dk sonra kesişir ve (dump'lanan)
    # tauri-driver.log görünür olur.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # Rust derleme katmanı cache'lenir: smoke'ın içinden tetiklenen
      # `tauri dev` derlemesi cache'ten saniyeler sürer, new-session bloğu
      # dakikalarca derleme beklemez.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            webkit2gtk-driver \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Backend setup
        run: bash scripts/setup-dev.sh --backend-only

      - name: Frontend setup
        run: bash scripts/setup-dev.sh --frontend-only

      - name: Desktop setup
        run: |
          cd desktop
          npm ci

      - name: Build frontend dist
        # generate_context! makrosu dev derlemesinde bile frontendDist yolunun
        # varlığını doğrular (tauri dev devUrl'den servis etse de). CI'da dist
        # üretilmeden Rust derlenirse makro panikleyip exit 101 verir.
        run: bash scripts/frontend-build.sh

      - name: Prebuild desktop shell (Rust)
        # tauri dev aynı target dizimini kullanır: smoke anında yeniden
        # derleme kalmaz, uygulama spawn'dan saniyeler içinde pencere açar.
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Desktop smoke doctor
        run: bash scripts/desktop-smoke-doctor.sh

      - name: Desktop shell smoke
        run: xvfb-run -a bash scripts/desktop-smoke.sh
